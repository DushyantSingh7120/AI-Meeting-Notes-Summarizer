<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini Summarize Test</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 200px; font-size: 14px; padding: 8px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 24px; font-size: 15px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h2>Gemini Summarize Test</h2>
  <textarea id="notes" placeholder="Paste meeting notes here..."></textarea>
  <br>
  <button id="btn">Summarize</button>
  <pre id="output">Result will appear here...</pre>

  <script type="module">
    import { GEMINI_MODEL, GEMINI_URL } from "./ai-config.js";

    document.getElementById("btn").addEventListener("click", async () => {
      const notes = document.getElementById("notes").value.trim();
      if (!notes) { alert("Please enter some meeting notes."); return; }

      const output = document.getElementById("output");
      output.textContent = "Loading...";

      const prompt = `You are a meeting summarizer. Analyze the following meeting notes and return ONLY a valid JSON object (no markdown code fences, no extra text) with exactly this shape:
{
  "summary": "<concise summary string>",
  "actionItems": [
    { "task": "<task description>", "owner": "<person name or Unassigned>" }
  ]
}

If no owner is clearly stated for an action item, use "Unassigned".

Meeting notes:
${notes}`;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(`API error ${res.status}: ${err}`);
        }

        const data = await res.json();
        let raw = data.candidates?.[0]?.content?.parts?.[0]?.text ?? "";

        // Strip markdown code fences if present
        raw = raw.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();

        const parsed = JSON.parse(raw);
        console.log("Parsed Gemini result:", parsed);
        output.textContent = JSON.stringify(parsed, null, 2);
      } catch (err) {
        console.error("Error:", err);
        output.textContent = "ERROR: " + err.message;
      }
    });
  </script>
</body>
</html>
